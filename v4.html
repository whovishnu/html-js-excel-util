<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge & Extract Columns from Excel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <h2>Upload Multiple Excel Files</h2>

    <input type="file" id="uploadExcel" accept=".xlsx" multiple onchange="loadColumnNames()" /><br><br>

    <button onclick="resetFiles()">Reset Files</button><br><br>

    <h3>Select Columns:</h3>
    <div id="columnsList"></div> <!-- Checkboxes will be added here -->

    <button onclick="extractColumns()">Download Merged File</button>

    <script>
        let mergedData = []; // Store merged row data
        let allColumnNames = new Set(); // Store all unique column names (case-insensitive)
        let columnMapList = []; // Store mapping of each file’s column name positions
        let fileInput = document.getElementById('uploadExcel');

        // Default columns (normalized to lowercase)
        let defaultColumns = new Set([
            "month", "product", "business type", "policy number", "endorsement", 
            "master holder name", "gwp", "commission", "comm amt", "comm_process_date", 
            "actual comm rate", "total commission", "policy_reference", "net premium", 
            "customer name", "lob", "net_premium", "policy_no", "insured_name", 
            "brokerage invoice value", "total", "policy_endt_no", "totalpayout", 
            "combine_client_name", "endorsement_ind", "product_name", "total_amt", 
            "insured_person", "type_of_policy", "policy_num", "endorsement_num", 
            "total_comm", "insured_customer_name", "pol_num_txt", 
            "applicable_premium_amount", "commission_rate_used", "endorsement_number", 
            "month current", "payout applicable on", "final comm to be paid", 
            "sum of net_prem", "sum of total irda", "sum of additional commission amount", 
            "policynumber", "premium", "insuredname", "premiumamount", 
            "commission amount", "commission rate", "client name", "type of business", 
            "endorsement id", "gross written premium", "totalcommamt", "dpollno", 
            "policy start date", "total premium", "total commission"
        ]);

        function loadColumnNames() {
            let files = fileInput.files;
            
            if (!files.length) return;

            mergedData = []; // Reset merged data
            allColumnNames.clear(); // Reset unique column names
            columnMapList = []; // Reset column map list

            let fileReadPromises = [];

            for (let file of files) {
                let reader = new FileReader();
                fileReadPromises.push(new Promise((resolve) => {
                    reader.onload = function (e) {
                        let data = new Uint8Array(e.target.result);
                        let workbook = XLSX.read(data, { type: 'array' });

                        let sheetName = workbook.SheetNames[0]; // First sheet
                        let worksheet = workbook.Sheets[sheetName];

                        let jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        if (jsonData.length === 0) {
                            resolve();
                            return;
                        }

                        let fileColumns = jsonData[0].map(col => col.toLowerCase().trim()); // Normalize column names
                        let columnMap = {}; // Map original column names to lowercase
                        jsonData[0].forEach((col, index) => {
                            let lowerCol = col.toLowerCase().trim();
                            allColumnNames.add(lowerCol);
                            columnMap[lowerCol] = index; // Store column position
                        });

                        columnMapList.push(columnMap);
                        mergedData.push(...jsonData.slice(1)); // Merge all rows except header
                        resolve();
                    };
                    reader.readAsArrayBuffer(file);
                }));
            }

            Promise.all(fileReadPromises).then(() => renderColumnSelection());
        }

        function renderColumnSelection() {
            let columnsList = document.getElementById('columnsList');
            columnsList.innerHTML = ""; // Clear previous selections

            let sortedColumns = Array.from(allColumnNames).sort();

            sortedColumns.forEach((colName) => {
                let isDefault = defaultColumns.has(colName);
                columnsList.innerHTML += `
                    <input type="checkbox" id="col_${colName}" value="${colName}" ${isDefault ? "checked disabled" : ""} />
                    <label for="col_${colName}">${colName}</label><br>
                `;
            });
        }

        function extractColumns() {
            let selectedColumns = [];
            let checkboxes = document.querySelectorAll('#columnsList input[type="checkbox"]:checked');

            if (checkboxes.length === 0) {
                alert("Please select at least one column.");
                return;
            }

            checkboxes.forEach(checkbox => {
                selectedColumns.push(checkbox.value); // Store selected column names (lowercase)
            });

            // Extract selected columns
            let extractedData = [selectedColumns]; // Header row

            mergedData.forEach(row => {
                let rowData = [];
                selectedColumns.forEach(colName => {
                    let value = "";

                    // Find the correct file mapping for this row
                    for (let columnMap of columnMapList) {
                        if (colName in columnMap) {
                            let colIndex = columnMap[colName];
                            if (row[colIndex] !== undefined) {
                                value = row[colIndex];
                                break; // Stop once we find the value in any file
                            }
                        }
                    }

                    rowData.push(value);
                });

                extractedData.push(rowData);
            });

            // Create new worksheet
            let newWorksheet = XLSX.utils.aoa_to_sheet(extractedData);
            let newWorkbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "Merged Data");

            // Convert to binary and trigger download
            let newExcel = XLSX.write(newWorkbook, { bookType: 'xlsx', type: 'array' });
            let blob = new Blob([newExcel], { type: "application/octet-stream" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement("a");
            a.href = url;
            a.download = "Merged_Selected_Columns.xlsx";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function resetFiles() {
            fileInput.value = ""; // Clear file input
            document.getElementById('columnsList').innerHTML = ""; // Clear column selection
            mergedData = [];
            allColumnNames.clear();
            columnMapList = [];
        }
    </script>

</body>
</html>
